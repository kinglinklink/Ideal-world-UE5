[/Script/EngineSettings.GameMapsSettings]
; The game builds its whole world from code at start-up, so it runs in any
; empty map. Tools/setup_assets.py makes /Game/IdealWorld/Maps/World and
; points these at it; until then the engine's own empty map is used.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/IdealWorld.IWGameMode

[/Script/Engine.PhysicsSettings]
; Real gravity: 9.81 m/s^2 (Unreal works in centimetres).
DefaultGravityZ=-981.000000
; Physics runs at 240 Hz, as in the Godot version.
bSubstepping=True
bSubsteppingAsync=False
MaxSubstepDeltaTime=0.004167
MaxSubsteps=16
MaxPhysicsDeltaTime=0.066667
; Spinning parts: allow about 5,000 rpm (the engine's default caps at 600 rpm).
MaxAngularVelocity=30000.000000
; Friction between two surfaces multiplies their coefficients. Every spawned
; body is given the square root of its material's coefficient, so two bodies
; grip by sqrt(mu1) x sqrt(mu2) = the geometric mean, as the design asks.
FrictionCombineMode=Multiply
RestitutionCombineMode=Min
bEnableShapeSharing=False
bEnableCCD=True

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=2
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.CollisionProfile]
; Spawned bodies use the standard PhysicsBody profile; the character's
; capsule is query-only (see IWCharacter.cpp), so bodies never get shoved by
; the engine: every push on a body is a force in newtons from the game.

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum
